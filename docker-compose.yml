services:
  web:
    build: .
    ports:
      - "8001:8001"
    env_file:
      - .env
    environment:
      # 1. Затикаємо попередження про hardlink
      - UV_LINK_MODE=copy
      # 2. Змушуємо Docker створювати свій .venv в ізольованому місці,
      # а не в папці /app (щоб він не перезаписував твій Mac .venv)
      - UV_PROJECT_ENVIRONMENT=/opt/venv
    volumes:
      - .:/app
    command:
      - uv
      - run
      - uvicorn
      - src.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8001"
      - --reload
